name: Deploy Production Environment
# Documentation: docs/workflows/prod-deployment-workflow.md

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/remote/templates/parent-template.yaml'
      - 'infra/remote/parameters/prod.json'
      - 'infra/remote/global/**'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - blue-green
          - rollback
      confirm_production:
        description: 'Type "PRODUCTION" to confirm deployment'
        required: true
        type: string

env:
  AWS_REGION: eu-west-2
  GLOBAL_STACK_NAME: party-collection-global
  PROD_STACK_NAME: party-collection-prod

permissions:
  id-token: write
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        echo "Running security checks..."
        # Add actual security scanning tools here
        # Example: Snyk, OWASP, etc.
        
    - name: Validate production confirmation
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ github.event.inputs.confirm_production }}" != "PRODUCTION" ]; then
            echo "❌ Production deployment not confirmed"
            echo "You must type 'PRODUCTION' exactly to confirm deployment"
            exit 1
          fi
          echo "✅ Production deployment confirmed"
        else
          echo "❌ SECURITY: Production deployment blocked for push events"
          echo "Production can only be deployed via workflow_dispatch with confirmation"
          echo "Use GitHub Actions > Deploy Production Environment > Run workflow"
          exit 1
        fi

  deploy-global:
    runs-on: ubuntu-latest
    needs: security-checks
    environment: production-global
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_GLOBAL }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Check if global stack exists
      id: global-check
      run: |
        if aws cloudformation describe-stacks --stack-name ${{ env.GLOBAL_STACK_NAME }} > /dev/null 2>&1; then
          echo "stack_exists=true" >> $GITHUB_OUTPUT
        else
          echo "stack_exists=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Deploy Global Infrastructure
      run: |
        cd infra/remote
        aws cloudformation deploy \
          --template-file global/template.yaml \
          --stack-name ${{ env.GLOBAL_STACK_NAME }} \
          --parameter-overrides \
            ParameterKey=GitHubOrg,ParameterValue=${{ github.repository_owner }} \
            ParameterKey=GitHubRepo,ParameterValue=${{ github.event.repository.name }} \
            file://global/parameters/global.json \
          --capabilities CAPABILITY_IAM \
          --no-fail-on-empty-changeset
          
    - name: Upload templates to S3
      run: |
        # Get S3 bucket from stack outputs
        BUCKET_NAME=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.GLOBAL_STACK_NAME }} \
          --query 'Stacks[0].Outputs[?OutputKey==`TemplatesBucketName`].OutputValue' \
          --output text)
          
        cd infra/remote
        aws s3 sync templates/ s3://$BUCKET_NAME/substacks/ --delete
        
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-global
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Build and Test Backend
      run: |
        cd backend
        npm ci
        npm run build
        npm test
        
    - name: Build and Test Frontend
      run: |
        cd frontend
        npm ci
        npm run build
        npm run lint
        # npm run test:e2e # Add when ready
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Set up Docker Buildx for ARM64
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push Docker images (ARM64)
      run: |
        # Backend
        cd backend
        docker buildx build --platform linux/arm64 \
          -t ${{ steps.login-ecr.outputs.registry }}/party-collection-backend:${{ github.sha }} \
          -t ${{ steps.login-ecr.outputs.registry }}/party-collection-backend:prod-latest \
          --push .
        
        # Frontend
        cd ../frontend
        docker buildx build --platform linux/arm64 \
          -t ${{ steps.login-ecr.outputs.registry }}/party-collection-frontend:${{ github.sha }} \
          -t ${{ steps.login-ecr.outputs.registry }}/party-collection-frontend:prod-latest \
          --push .
        
    - name: Deploy Production Infrastructure
      run: |
        cd infra/remote
        
        # Get current deployment state
        if aws cloudformation describe-stacks --stack-name ${{ env.PROD_STACK_NAME }} > /dev/null 2>&1; then
          echo "Updating existing production stack..."
          DEPLOYMENT_TYPE="update"
        else
          echo "Creating new production stack..."
          DEPLOYMENT_TYPE="create"
        fi
        
        aws cloudformation deploy \
          --template-file templates/parent-template.yaml \
          --stack-name ${{ env.PROD_STACK_NAME }} \
          --parameter-overrides \
            ParameterKey=AlertEmail,ParameterValue=${{ secrets.ALERT_EMAIL }} \
            ParameterKey=DomainName,ParameterValue=${{ secrets.DOMAIN_NAME }} \
            ParameterKey=CertificateArn,ParameterValue=${{ secrets.CERTIFICATE_ARN }} \
            file://parameters/prod.json \
          --capabilities CAPABILITY_IAM \
          --no-fail-on-empty-changeset
          
    - name: Wait for deployment to be ready
      run: |
        echo "Waiting for services to be healthy..."
        
        # Get ALB DNS name
        ALB_DNS=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.PROD_STACK_NAME }} \
          --query 'Stacks[0].Outputs[?OutputKey==`ApplicationURL`].OutputValue' \
          --output text)
          
        echo "ALB DNS: $ALB_DNS"
        
        # Wait for health checks
        for i in {1..30}; do
          if curl -f $ALB_DNS/health > /dev/null 2>&1; then
            echo "✅ Production deployment healthy"
            break
          fi
          echo "⏳ Waiting for deployment... ($i/30)"
          sleep 30
        done
        
    - name: Run production health checks
      run: |
        ALB_DNS=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.PROD_STACK_NAME }} \
          --query 'Stacks[0].Outputs[?OutputKey==`ApplicationURL`].OutputValue' \
          --output text)
          
        # Comprehensive health checks
        echo "🔍 Running production health checks..."
        
        # Backend API health
        curl -f $ALB_DNS/health || exit 1
        
        # Frontend accessibility
        curl -f $ALB_DNS/ || exit 1
        
        # Database connectivity (through backend)
        curl -f $ALB_DNS/api/status || exit 1
        
        echo "✅ All production health checks passed"
        
    - name: Update production DNS (if domain configured)
      if: env.DOMAIN_NAME != ''
      run: |
        echo "🌐 Production deployment complete"
        echo "Application available at: https://${{ secrets.DOMAIN_NAME }}"
        
  rollback:
    runs-on: ubuntu-latest
    if: github.event.inputs.deployment_type == 'rollback'
    environment: production
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Rollback production deployment
      run: |
        echo "🔄 Rolling back production deployment..."
        
        # Get previous task definition
        CLUSTER_NAME="party-collection-prod-cluster"
        BACKEND_SERVICE="party-collection-prod-backend"
        FRONTEND_SERVICE="party-collection-prod-frontend"
        
        # This would implement actual rollback logic
        # For now, we'll update to the previous image tag
        echo "Rollback logic would be implemented here"
        
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Notify deployment status
      uses: actions/github-script@v7
      with:
        script: |
          const deployStatus = '${{ needs.deploy-production.result }}';
          const deploymentUrl = process.env.DOMAIN_NAME ? 
            `https://${process.env.DOMAIN_NAME}` : 
            'Check CloudFormation outputs for ALB DNS';
            
          let title, color, message;
          
          if (deployStatus === 'success') {
            title = '✅ Production Deployment Successful';
            color = 'success';
            message = `Production deployment completed successfully!\n\nAccess: ${deploymentUrl}`;
          } else {
            title = '❌ Production Deployment Failed';
            color = 'failure';
            message = `Production deployment failed. Check logs for details.`;
          }
          
          // In a real implementation, this would send to Slack, email, etc.
          console.log(`${title}\n${message}`);
          
          // Create a deployment status
          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: context.payload.deployment?.id || 0,
            state: deployStatus === 'success' ? 'success' : 'failure',
            description: message,
            environment_url: deploymentUrl
          }).catch(() => {
            // Ignore if deployment doesn't exist
          });