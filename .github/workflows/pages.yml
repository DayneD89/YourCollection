name: Deploy Test Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Dev Environment Testing & Reporting", "Production Testing & Reporting"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download test report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-report-*'
          merge-multiple: true
          path: ./artifacts/

      - name: Create Pages directory structure
        run: |
          mkdir -p pages
          
          # Copy any existing reports
          if [ -d "reports" ]; then
            cp -r reports/* pages/ 2>/dev/null || true
          fi
          
          # Copy artifacts to appropriate locations
          if [ -d "artifacts" ]; then
            find artifacts -type f -name "*.html" -o -name "*.json" | while read file; do
              # Extract environment and report type from path
              env=""
              if [[ "$file" == *"dev"* ]]; then
                env="dev"
              elif [[ "$file" == *"prod"* ]]; then
                env="prod"
              elif [[ "$file" == *"local"* ]]; then
                env="local"
              fi
              
              if [ -n "$env" ]; then
                mkdir -p "pages/$env/latest"
                mkdir -p "pages/$env/history"
                cp "$file" "pages/$env/latest/" 2>/dev/null || true
              fi
            done
          fi

      - name: Create Pages index
        run: |
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Party Collection Test Reports</title>
              <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
              <style>
                  .environment-card {
                      transition: transform 0.2s;
                      height: 100%;
                  }
                  .environment-card:hover {
                      transform: translateY(-2px);
                  }
                  .status-badge {
                      font-size: 0.8em;
                  }
              </style>
          </head>
          <body>
              <div class="container py-5">
                  <div class="row">
                      <div class="col-12 text-center mb-5">
                          <h1 class="display-4">🎉 Party Collection</h1>
                          <p class="lead">Test Reports Dashboard</p>
                      </div>
                  </div>
                  
                  <div class="row g-4">
                      <!-- Local Environment -->
                      <div class="col-md-4">
                          <div class="card environment-card">
                              <div class="card-header bg-primary text-white">
                                  <h5 class="mb-0">🏠 Local Environment</h5>
                              </div>
                              <div class="card-body">
                                  <p class="card-text">Development testing against local Docker environment</p>
                                  <div class="d-grid gap-2">
                                      <a href="local/latest/" class="btn btn-outline-primary">
                                          📊 Latest Report
                                      </a>
                                      <a href="local/history/" class="btn btn-sm btn-outline-secondary">
                                          📚 History
                                      </a>
                                  </div>
                              </div>
                          </div>
                      </div>
                      
                      <!-- Dev Environment -->
                      <div class="col-md-4">
                          <div class="card environment-card">
                              <div class="card-header bg-warning text-dark">
                                  <h5 class="mb-0">🚧 Dev Environment</h5>
                              </div>
                              <div class="card-body">
                                  <p class="card-text">Automated testing against AWS development deployment</p>
                                  <div class="d-grid gap-2">
                                      <a href="dev/latest/" class="btn btn-outline-warning">
                                          📊 Latest Report
                                      </a>
                                      <a href="dev/history/" class="btn btn-sm btn-outline-secondary">
                                          📚 History
                                      </a>
                                  </div>
                              </div>
                          </div>
                      </div>
                      
                      <!-- Production Environment -->
                      <div class="col-md-4">
                          <div class="card environment-card">
                              <div class="card-header bg-success text-white">
                                  <h5 class="mb-0">🚀 Production Environment</h5>
                              </div>
                              <div class="card-body">
                                  <p class="card-text">Smoke testing against live production deployment</p>
                                  <div class="d-grid gap-2">
                                      <a href="prod/latest/" class="btn btn-outline-success">
                                          📊 Latest Report
                                      </a>
                                      <a href="prod/history/" class="btn btn-sm btn-outline-secondary">
                                          📚 History
                                      </a>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <div class="row mt-5">
                      <div class="col-12">
                          <div class="card">
                              <div class="card-body">
                                  <h5 class="card-title">📋 Testing Overview</h5>
                                  <div class="row">
                                      <div class="col-md-6">
                                          <h6>Backend Tests (13 scenarios)</h6>
                                          <ul class="list-unstyled">
                                              <li>• Authentication & JWT tokens</li>
                                              <li>• User management & CRUD operations</li>
                                              <li>• Password security & validation</li>
                                              <li>• Admin functionality</li>
                                              <li>• API security & authorization</li>
                                          </ul>
                                      </div>
                                      <div class="col-md-6">
                                          <h6>Frontend E2E Tests (18 scenarios)</h6>
                                          <ul class="list-unstyled">
                                              <li>• Authentication flows</li>
                                              <li>• Admin user management</li>
                                              <li>• Password change workflows</li>
                                              <li>• UI validation & feedback</li>
                                              <li>• Navigation & responsive design</li>
                                          </ul>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <div class="row mt-3">
                      <div class="col-12 text-center">
                          <p class="text-muted">
                              <small>
                                  Reports are automatically generated after deployments and tests. 
                                  <br>
                                  Last updated: <span id="lastUpdated"></span>
                              </small>
                          </p>
                      </div>
                  </div>
              </div>
              
              <script>
                  document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
              </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        run: |
          echo "✅ GitHub Pages deployed successfully"
          echo "📊 Test reports available at: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "Available environments:"
          echo "- Local: ${{ steps.deployment.outputs.page_url }}local/latest/"
          echo "- Dev: ${{ steps.deployment.outputs.page_url }}dev/latest/"
          echo "- Prod: ${{ steps.deployment.outputs.page_url }}prod/latest/"