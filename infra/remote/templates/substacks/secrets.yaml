AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Secrets Substack - Application Secrets Management
  
  Consolidated secrets for cost optimization and security.

Parameters:
  ProjectName:
    Type: String
    Description: Base name for all resources
    
  Environment:
    Type: String
    Description: Environment identifier

Resources:
  # Consolidated JWT Secret
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-jwt-secret"
      Description: JWT secret for authentication
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: jwt_secret
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: Authentication

  # Session Secret (if needed)
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-session-secret"
      Description: Session secret for web sessions
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: Session

Outputs:
  JWTSecretArn:
    Description: JWT secret ARN
    Value: !Ref JWTSecret
    
  SessionSecretArn:
    Description: Session secret ARN  
    Value: !Ref SessionSecret
    
  SecretsConfiguration:
    Description: Secrets configuration summary
    Value: !Sub "JWT and session secrets for ${Environment} environment"